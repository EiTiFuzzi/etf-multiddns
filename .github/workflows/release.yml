name: Release image

# Builds the Docker image and publishes it to the GitHub Container Registry
# (ghcr.io) as soon as a GitHub Release is published. That way nobody needs
# to run "docker build" locally anymore - a "docker pull" is enough.
#
# Flow:
#   1. Create and push a tag, e.g.: git tag v1.0.0 && git push origin v1.0.0
#   2. On GitHub, under "Releases" -> "Draft a new release", pick the tag
#      and publish it (or: gh release create v1.0.0 --generate-notes)
#   3. This workflow automatically builds (amd64 + arm64) and pushes to
#      ghcr.io/<owner>/<repo>:1.0.0 and ghcr.io/<owner>/<repo>:latest
#      (owner/repo are automatically lowercased in the process, even if
#      your GitHub username contains uppercase letters)

on:
  release:
    types: [published]
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU (for multi-arch builds)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase the repository name
        # Docker/OCI image names must be entirely lowercase, but a GitHub
        # username/repo (e.g. "SomeUser/ETF-MultiDDNS") is allowed to
        # contain mixed case. Without this step, the push would fail with
        # "invalid reference format" as soon as the GitHub user or repo name
        # contains uppercase letters.
        id: repo
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Determine image metadata (tags/labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.repo.outputs.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.event_name == 'release' && !github.event.release.prerelease }}

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Bake the Git tag into the image as the version, so the Web UI can
          # show it in the footer (see Dockerfile: ARG/ENV APP_VERSION).
          # Falls back to "dev" on a manual workflow_dispatch without an
          # associated release.
          build-args: |
            APP_VERSION=${{ github.event.release.tag_name || 'dev' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
